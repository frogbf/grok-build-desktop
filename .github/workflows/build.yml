# Build installers on each platform's native runner.
# Mac/Linux packages must not be cross-compiled (node-pty + electron-builder).
#
# Triggers:
#   - workflow_dispatch: Actions → Build → Run workflow
#   - push tags: v0.1.1 → builds + attaches artifacts to a GitHub Release
#   - pull_request: typecheck only (fast)
#
# Artifacts (unsigned): download from the run's "Artifacts" or the Release page.

name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: win,mac,linux,all)'
        required: false
        default: 'all'
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip code-signing discovery (no Apple/Windows certs in CI by default)
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Do not auto-publish; we upload artifacts / create draft releases ourselves
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # package-lock uses registry.npmjs.org (not npmmirror) — see .npmrc

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # TS only — never download Electron or compile node-pty.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts --fetch-timeout=60000 --fetch-retries=2
      - run: npm run typecheck

  build-windows:
    name: Windows
    needs: typecheck
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' &&
      (contains(github.event.inputs.platforms, 'win') || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == '')
    # windows-2022 = VS 2022 (node-gyp@9 cannot detect VS 2026 on windows-latest).
    # Avoid msvc-dev-cmd — VCINSTALLDIR breaks node-gyp install path matching.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show commit
        shell: pwsh
        run: git log -1 --oneline; git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org
      # node-gyp@9 still imports distutils; Python 3.12+ removed it.
      # Same pin as mac/linux — runner default Python is often 3.12+.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install setuptools for node-gyp
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools
          python -c "from distutils.version import StrictVersion; print('distutils ok', StrictVersion('1.0'))"
          python --version
      # Normal npm ci so electron/install.js downloads the binary.
      # Skip root install-app-deps; rebuild:pty is explicit and hardened.
      - name: Install dependencies
        run: npm ci --fetch-timeout=60000 --fetch-retries=2
        env:
          SKIP_ELECTRON_INSTALL_APP_DEPS: '1'
          npm_config_python: python
      - name: Verify node-gyp (must be 9.x for electron-rebuild 3.x)
        shell: pwsh
        run: |
          node -e "const {createRequire}=require('module'); const r=createRequire(require.resolve('@electron/rebuild/package.json')); const p=r('node-gyp/package.json'); console.log('node-gyp', p.version, r.resolve('node-gyp/package.json')); if(+p.version.split('.')[0]!==9) process.exit(1)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath,catalog_productLineVersion
      - name: Rebuild node-pty for Electron
        timeout-minutes: 10
        run: npm run rebuild:pty
        env:
          npm_config_msvs_version: '2022'
          npm_config_python: python
      - name: Build Windows installers
        run: npm run dist:win
        env:
          npm_config_msvs_version: '2022'
          npm_config_python: python
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  build-mac:
    name: macOS
    needs: typecheck
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' &&
      (contains(github.event.inputs.platforms, 'mac') || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == '')
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install setuptools for node-gyp
        run: |
          python -m pip install --upgrade pip setuptools
          python -c "from distutils.version import StrictVersion; print('distutils ok', StrictVersion('1.0'))"
      - name: Install dependencies
        run: npm ci --fetch-timeout=60000 --fetch-retries=2
        env:
          npm_config_python: python
          SKIP_ELECTRON_INSTALL_APP_DEPS: '1'
      - name: Rebuild node-pty for Electron
        timeout-minutes: 10
        run: npm run rebuild:pty
        env:
          npm_config_python: python
      - name: Build macOS DMG
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          npm_config_python: python
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux
    needs: typecheck
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' &&
      (contains(github.event.inputs.platforms, 'linux') || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg
      - name: Install setuptools for node-gyp
        run: |
          python -m pip install --upgrade pip setuptools
          python -c "from distutils.version import StrictVersion; print('distutils ok')"
      - name: Install dependencies
        run: npm ci --fetch-timeout=60000 --fetch-retries=2
        env:
          npm_config_python: python
          SKIP_ELECTRON_INSTALL_APP_DEPS: '1'
      - name: Rebuild node-pty for Electron
        timeout-minutes: 10
        run: npm run rebuild:pty
        env:
          npm_config_python: python
      - name: Build Linux packages
        run: npm run dist:linux
        env:
          npm_config_python: python
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [build-windows, build-mac, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List downloaded files
        run: find dist -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.blockmap
            dist/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
