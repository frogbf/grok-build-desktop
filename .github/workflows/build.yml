# Build installers on each platform's native runner.
# Mac/Linux packages must not be cross-compiled (node-pty + electron-builder).
#
# Triggers:
#   - workflow_dispatch: Actions → Build → Run workflow
#   - push tags: v0.1.1 → builds + attaches artifacts to a GitHub Release
#   - pull_request: typecheck only (fast)
#
# Artifacts (unsigned): download from the run's "Artifacts" or the Release page.

name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: win,mac,linux,all)'
        required: false
        default: 'all'
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip code-signing discovery (no Apple/Windows certs in CI by default)
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Do not auto-publish; we upload artifacts / create draft releases ourselves
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # Typecheck only needs TS; never compile node-pty here (postinstall hung ~10h).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # --ignore-scripts: skip postinstall → electron-builder install-app-deps
      # which tries to rebuild node-pty (slow / can hang on bare ubuntu).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  build-windows:
    name: Windows
    needs: typecheck
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' &&
      (contains(github.event.inputs.platforms, 'win') || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == '')
    # Pin windows-2022 (VS 2022). Do NOT use msvc-dev-cmd here: it sets
    # VCINSTALLDIR and node-gyp then rejects every VS install on path mismatch.
    # package.json overrides node-gyp → 12.x (VS 2022 + 2026 detection).
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show commit (must be latest main for this fix)
        shell: pwsh
        run: |
          git log -1 --oneline
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          # node-gyp 12 requires Node ^20.17 or >=22.9
          node-version: '22'
          cache: npm
      # Skip postinstall; rebuild:pty runs explicitly after env is ready.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify node-gyp override (must be 12+)
        shell: pwsh
        run: |
          node -e "const p=require('node-gyp/package.json'); console.log('node-gyp', p.version, require.resolve('node-gyp/package.json')); const m=+p.version.split('.')[0]; if(m<12) process.exit(1)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -format json | ConvertFrom-Json | ForEach-Object {
                Write-Host "VS $($_.installationVersion) at $($_.installationPath)"
              }
          } else {
            throw "vswhere.exe missing on runner"
          }
      - name: Rebuild node-pty for Electron
        shell: pwsh
        run: npm run rebuild:pty
        env:
          # Year only — full paths with spaces break some node-gyp paths.
          # scripts/rebuild-pty.mjs also clears VCINSTALLDIR if present.
          npm_config_msvs_version: '2022'
      - name: Build Windows installers
        run: npm run dist:win
        env:
          npm_config_msvs_version: '2022'
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  build-mac:
    name: macOS
    needs: typecheck
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' &&
      (contains(github.event.inputs.platforms, 'mac') || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == '')
    # Apple Silicon runner (arm64)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Python 3.12+ dropped distutils; node-gyp still imports StrictVersion from it.
      # Prefer Python 3.11 (still has distutils) + setuptools as a belt-and-suspenders.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install setuptools for node-gyp
        run: |
          python -m pip install --upgrade pip setuptools
          python -c "from distutils.version import StrictVersion; print('distutils ok', StrictVersion('1.0'))"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_python: python
      - name: Rebuild node-pty for Electron
        run: npm run rebuild:pty
        env:
          npm_config_python: python
      - name: Build macOS DMG
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          npm_config_python: python
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux
    needs: typecheck
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' &&
      (contains(github.event.inputs.platforms, 'linux') || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg
      - name: Install setuptools for node-gyp
        run: |
          python -m pip install --upgrade pip setuptools
          python -c "from distutils.version import StrictVersion; print('distutils ok')"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_python: python
      - name: Rebuild node-pty for Electron
        run: npm run rebuild:pty
        env:
          npm_config_python: python
      - name: Build Linux packages
        run: npm run dist:linux
        env:
          npm_config_python: python
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [build-windows, build-mac, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List downloaded files
        run: find dist -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.blockmap
            dist/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
